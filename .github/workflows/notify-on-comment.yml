name: Notify on task comment

on:
  issue_comment:
    types: [created]

jobs:
  send-notification:
    runs-on: ubuntu-latest
    env:
      HAS_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK != '' }}
    steps:
      - name: Send email notification
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL_USER }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          to: bkaufman@redarcenv.com, zwilson@redarcenv.com
          from: RedArc Project Dashboard <${{ secrets.NOTIFY_EMAIL_USER }}>
          subject: "💬 New comment on: ${{ github.event.issue.title }}"
          html_body: |
            <div style="font-family:sans-serif;max-width:600px;margin:0 auto;">
              <div style="background:#1a202c;padding:16px 24px;border-radius:8px 8px 0 0;">
                <span style="color:white;font-weight:700;font-size:15px;">RedArc × SAR — Project Dashboard</span>
              </div>
              <div style="border:1px solid #eef0f3;border-top:none;border-radius:0 0 8px 8px;padding:24px;">
                <p style="margin:0 0 12px;font-size:15px;color:#1a202c;">
                  <strong>${{ github.event.comment.user.login }}</strong> left a comment on:
                </p>
                <div style="background:#f7f8fa;border-left:4px solid #c0392b;border-radius:4px;padding:10px 16px;margin-bottom:16px;">
                  <strong style="color:#1a202c;">${{ github.event.issue.title }}</strong>
                </div>
                <div style="background:#f7f8fa;border-radius:6px;padding:14px 16px;margin-bottom:20px;color:#4a5568;font-size:14px;line-height:1.6;">
                  ${{ github.event.comment.body }}
                </div>
                <a href="${{ github.event.comment.html_url }}"
                   style="display:inline-block;background:#c0392b;color:white;text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:600;font-size:14px;">
                  View comment →
                </a>
                <p style="margin:20px 0 0;font-size:12px;color:#7f8c8d;">
                  <a href="https://bkaufmantx.github.io/redarcenv/" style="color:#2980b9;">Open project dashboard</a>
                </p>
              </div>
            </div>

      - name: Send Google Chat notification
        if: env.HAS_CHAT_WEBHOOK == 'true'
        continue-on-error: true
        run: |
          curl -s -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cards": [{
                "header": {
                  "title": "RedArc Project Dashboard",
                  "subtitle": "New comment posted"
                },
                "sections": [{
                  "widgets": [
                    {
                      "keyValue": {
                        "topLabel": "Task",
                        "content": "${{ github.event.issue.title }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "From",
                        "content": "${{ github.event.comment.user.login }}"
                      }
                    },
                    {
                      "textParagraph": {
                        "text": "${{ github.event.comment.body }}"
                      }
                    },
                    {
                      "buttons": [{
                        "textButton": {
                          "text": "VIEW COMMENT",
                          "onClick": {
                            "openLink": {
                              "url": "${{ github.event.comment.html_url }}"
                            }
                          }
                        }
                      }]
                    }
                  ]
                }]
              }]
            }'
